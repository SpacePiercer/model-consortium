<script>
(function () {
  var frame = document.getElementById('frame');
  function fit() {
    var s = Math.min(window.innerWidth / 1440, window.innerHeight / 810);
    frame.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit); fit();
  var opts = {"mode": "battle", "stations": true, "typing": "p1", "tvMode": "offering"};
  opts.tv = document.getElementById('tv');
  window.arena = ArenaEngine.create(document.getElementById('stage'), opts);
})();
</script>
<script>
(function () {
  FX.init();
  // menace around both gladiators
  FX.menace({ x: 1230, y: 560, w: 170, h: 170, color: '#FF4FB0', every: 420 });
  FX.menace({ x: 30, y: 180, w: 320, h: 200, color: '#B6FF4A', every: 520, min: 40, max: 64 });

  // fake countdown (prototype only — the server owns the real timer)
  var timer = document.getElementById('timer'), t = 42;
  setInterval(function () {
    t = t <= 0 ? 42 : t - 1;
    timer.textContent = '00:' + (t < 10 ? '0' : '') + t;
    timer.classList.toggle('fx-hot', t <= 10);
    if (t === 10) { FX.lines(900, { color: 'rgba(176,76,255,0.85)' }); FX.slam('ゴゴゴ', { sub: '10 SECONDS', color: '#B04CFF', size: 150 }); }
    if (t > 0 && t <= 5) FX.shake(160, 4);
  }, 1000);

  // typing: character count + a sound effect every few keystrokes
  var ta = document.getElementById('testimony'), count = document.getElementById('count'), keys = 0;
  var words = ['オラ', 'ドド', 'ドドド', 'ゴ', 'オラオラ'];
  ta.addEventListener('input', function () {
    count.textContent = ta.value.length + '/300';
    if (++keys >= 14) {
      keys = 0;
      FX.pop(words[Math.floor(Math.random() * words.length)], 120 + Math.random() * 640, 350 + Math.random() * 50, { size: 46 + Math.random() * 24 });
    }
  });

  FX.beforeNav(document.getElementById('seal'), function () {
    FX.invert(3); FX.lines(1000, { color: 'rgba(255,70,40,0.9)' }); FX.shake(500, 12);
    FX.slam('ドン!', { sub: 'SEALED', color: '#FF3B30', size: 230, hold: 1000 });
  }, 1000);
})();
</script>
